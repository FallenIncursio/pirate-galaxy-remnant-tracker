[tracker]
server = "Korell"
realm_id = 2
poll_seconds = 180
retention_days = 30

[runtime]
# Local credential file with Name: and PW: lines. Never commit it.
credentials_file = "credentials.env"
manifest = "data/runtime/manifest.json"
# Windows default: sandboxie. Linux: process (with systemd for unattended use).
# backend = "process"

[sandbox]
start = '%ProgramFiles%/Sandboxie-Plus/Start.exe'
box = "PirateGalaxyRemnants"
root = 'data/sandbox'

[paths]
data = "data"

[discord]
username = "Remnant Tracker"
webhook_environments = ["DISCORD_WEBHOOK_URL"]
# For a second channel: ["DISCORD_WEBHOOK_URL", "DISCORD_WEBHOOK_SECONDARY_URL"]
